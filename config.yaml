# TUNDA — affect-aware voice companion configuration
# Not a therapist / not emergency care. See README for honest scope.

# Performance profile
performance:
  profile: "balanced"  # fast, balanced, quality
  latency_budget_ms: 1200
  latency_budget_min_ms: 600
  latency_budget_max_ms: 2000
  latency_ewma_alpha: 0.2
  adaptive_latency_enabled: true
  prewarm_models: true
  lazy_load: false
  gpu_mem_min_gb_for_large_stt: 10.0
  gpu_mem_min_gb_for_large_llm: 12.0
  llm_models:
    fast: "llama3.1:8b"
    balanced: "llama3.1:8b"
    quality: "llama3.1:70b"

# Audio Settings
audio:
  sample_rate: 16000
  chunk_size: 1024
  channels: 1
  input_device: null  # null for default, or device index
  output_device: null
  silence_threshold: 0.01
  silence_duration: 2.0  # seconds of silence before processing
  min_speech_seconds: 0.3
  max_segment_seconds: 20.0
  queue_maxsize: 10
  noise_reduction: false

# Speech Recognition
speech_recognition:
  model: "auto"  # auto, tiny, base, small, medium, large, large-v3
  language: "en"  # auto-detect if "auto"
  temperature: 0.0
  beam_size: 5
  best_of: 5
  patience: 1.0
  device: null  # "cpu", "cuda", or null for auto
  compute_type: "auto"  # auto, int8, int8_float16, float16, float32
  cpu_threads: null
  num_workers: 2
  plugin: null
  dynamic_model_switching: true
  short_model: "small"
  long_model: "large-v3"
  short_utterance_seconds: 4.0
  vad_filter: true
  vad_threshold: 0.5
  vad_min_silence_duration_ms: 300
  vad_speech_pad_ms: 200
  vad_adaptive: true
  vad_adaptive_min: 0.3
  vad_adaptive_max: 0.8
  vad_adaptive_scale: 1.8
  vad_noise_percentile: 0.1
  initial_prompt: null
  condition_on_previous_text: true
  denoise: true

# Emotion Detection
emotion_detection:
  enabled: true
  model_type: "wav2vec2" # Options: "random_forest", "wav2vec2", "auto"
  confidence_threshold: 0.6
  dl_model_name: "superb/wav2vec2-base-superb-er"
  device: null  # "cpu", "cuda", or null for auto
  plugin: null
  lazy_load: false
  supported_emotions:
    - happy
    - sad
    - angry
    - anxious
    - calm
    - neutral
  feature_extraction:
    mfcc_coefficients: 13
    chroma_features: 12
    spectral_features: true
    prosodic_features: true
    window_size: 2048
    hop_length: 512

# Response Generation
response_generation:
  llm_provider: "ollama"  # ollama, huggingface, openai
  model_name: "llama3.1:8b"
  max_tokens: 150
  temperature: 0.7
  top_p: 0.9
  repeat_penalty: 1.1
  max_memories: 3
  plugin: null
  lazy_load: false
  safety_enabled: true
  safety_confidence_threshold: 0.6
  safety_region: "US"  # US, CA, UK, IE, AU, NZ, IN
  safety_log_events: true
  safety_log_user_text: false
  safety_log_path: "logs/crisis_events.jsonl"
  crisis_message: "I'm really sorry you're feeling this way. You deserve support. If you are in immediate danger or thinking about harming yourself, please contact your local emergency number or a trusted person right now."
  empathy_styles:
    supportive: "Provide warm, encouraging responses that validate emotions"
    reflective: "Mirror back emotions and help process feelings"
    solution_focused: "Acknowledge emotions while gently guiding toward solutions"
    therapeutic: "Use CBT-inspired techniques for emotional support"
  default_style: "supportive"

# Clinic trust
clinic:
  profile: "companion"  # companion | between_sessions | high_risk_watch
  allow_web_profile_switch: true

# Personality Settings
personality:
  name: "Tunda"
  greeting_style: "warm_personal"
  ask_about_day: true
  offer_care_plans: true
  remember_user_name: true
  personality_traits:
    - "caring"
    - "attentive"
    - "therapeutic"
    - "supportive"

# Text-to-Speech
text_to_speech:
  provider: "system"  # system, piper, coqui (system is most compatible)
  voice_model: "default"
  speaking_rate: 1.0
  pitch_adjustment: 0.0
  volume: 0.8
  emotion_adaptive: true
  barge_in: true
  barge_in_min_chunks: 4
  barge_in_energy_multiplier: 2.4
  barge_in_grace_ms: 350
  lazy_load: false
  streaming: true
  stream_chunk_chars: 140
  first_chunk_chars: 64
  target_first_audio_ms: 800
  voice_mapping:
    happy: "default"
    sad: "default"
    angry: "default"
    anxious: "default"
    calm: "default"
    neutral: "default"

# Memory and Context
memory:
  enabled: true
  max_history_length: 50
  emotion_history_window: 10
  context_window: 5
  retrieval_limit: 3
  save_conversations: true
  conversation_file: "data/conversations.json"
  encrypt: true
  require_consent: true
  key_file: "data/.memory_key"
  max_items: 2000
  prune_to: 1500
  prune_strategy: "global"
  importance_threshold: 0.2
  batch_embeddings: true
  batch_size: 8
  batch_flush_seconds: 1.5

# Web Interface
web:
  host: "localhost"
  port: 8000
  debug: false
  auto_reload: true

# API Server
api:
  host: "localhost"
  port: 8001
  cors_enabled: true
  rate_limiting: true
  max_requests_per_minute: 60

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "logs/empathic_voice.log"
  max_file_size: "10MB"
  backup_count: 5
  console_output: true

# Orchestrator
orchestrator:
  mode: "threaded"  # threaded, async

# Model Paths
models:
  whisper_cache: "models/whisper"
  emotion_model: "models/emotion_classifier.pkl"
  piper_voices: "models/piper_voices"
  ollama_models: "models/ollama"

# Development
development:
  mock_audio: false
  mock_llm: false
  save_audio_samples: false
  audio_samples_dir: "data/audio_samples"
  profiling_enabled: false
